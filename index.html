<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2728">
  <title>AQR 演示视频 · AQR Demo</title>
  <link rel="icon" href="assets/aqr-icon.png" type="image/png">
  <link rel="stylesheet" href="assets/demo.css">
  <script type="module" src="assets/feedback.js"></script>
  <style>
    #feedback { max-width: 38rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #315451; }
    #feedback label { display: block; margin-bottom: .5rem; font-weight: 650; }
    textarea { display: block; width: 100%; box-sizing: border-box; min-height: 6rem; resize: vertical; padding: .75rem; font: inherit; color: inherit; background: #102f30; border: 1px solid #6b8984; border-radius: .5rem; }
    button { margin-top: .75rem; padding: .55rem 1rem; border: 0; border-radius: .5rem; background: #a8f0d9; color: #0c2728; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; cursor: default; }
    #feedback-result { margin-left: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>AQR 演示视频 <span lang="en">· AQR Demo</span></h1>
    <video controls playsinline preload="metadata" aria-label="AQR 普通话配音演示 / AQR demo with Mandarin narration">
      <source src="assets/aqr-demo.mp4?v=mandarin" type="video/mp4">
    </video>
    <p>
      <a href="assets/aqr-demo.mp4?v=mandarin" download>下载中文 MP4 <span lang="en">/ Download Chinese MP4</span></a>
      <span aria-hidden="true"> · </span>
      <a href="en/" lang="en">English demo</a>
      <span aria-hidden="true"> · </span>
      <a href="#feedback">使用反馈 <span lang="en">/ Feedback</span></a>
    </p>
    <form id="feedback">
      <label for="feedback-message">使用反馈 <span lang="en">/ Feedback</span></label>
      <textarea id="feedback-message" maxlength="1500" required placeholder="写下你的意见 / Share your feedback"></textarea>
      <button type="submit" disabled>提交 <span lang="en">/ Submit</span></button>
      <span id="feedback-result" role="status"></span>
    </form>
  </main>
</body>
</html>
